name: Build Distribution Artifacts

on:
  workflow_dispatch:
    inputs:
      include_experimental:
        description: "Also build experimental CPython/architectures"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v0.1*"

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  CIBUILDWHEEL_VERSION: "4.1.1"

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package_version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Read and verify package version
        id: package_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          PY
          )"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version v${VERSION}." >&2
            exit 1
          fi
      - name: Verify legacy release workflow is disabled
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/younglion-ci.yml')
          if not path.exists():
              raise SystemExit(0)

          text = path.read_text(encoding='utf-8')
          forbidden = (
              'softprops/action-gh-release',
              'git push origin v0.0.9.8',
              'git tag -a v0.0.9.8',
              'Release v0.0.9.8',
          )
          found = [marker for marker in forbidden if marker in text]
          if found:
              raise SystemExit(
                  'Legacy automatic release logic is still active: ' + ', '.join(found)
              )
          print('Legacy workflow path is absent or safely disabled.')
          PY
      - name: Strict native build and tests
        env:
          YOUNGLION_STRICT: "1"
          PYTHONPATH: src
        run: |
          python -m pip install --upgrade pip setuptools wheel pytest
          python setup.py build_ext --inplace --force
          python -m compileall -q src tools tests
          python tools/smoke_test.py
          python -m pytest -q
          if [[ -f tools/check_stub_coverage.py ]]; then
            python tools/check_stub_coverage.py
          fi

  sdist:
    needs: preflight
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build and validate sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --outdir dist
          python -m twine check dist/*
      - name: Upload sdist component
        uses: actions/upload-artifact@v7
        with:
          name: component-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  wheels:
    needs: preflight
    name: Wheels / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # v0.1 official wheels: platforms already covered by the green
          # Native C++ CI matrix. Less-proven architectures remain experimental.
          - label: linux-x86_64
            os: ubuntu-24.04
            archs: x86_64
            experimental: false
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            archs: aarch64
            experimental: false
          - label: windows-x64
            os: windows-2025
            archs: AMD64
            experimental: false
          - label: macos-intel
            os: macos-15-intel
            archs: x86_64
            experimental: false
          - label: macos-arm64
            os: macos-15
            archs: arm64
            experimental: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install cibuildwheel
        shell: bash
        run: python -m pip install "cibuildwheel==${CIBUILDWHEEL_VERSION}"
      - name: Build and test wheels
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
        shell: bash
        run: |
          python -m cibuildwheel --output-dir wheelhouse
      - name: Upload stable wheel component
        if: ${{ !matrix.experimental }}
        uses: actions/upload-artifact@v7
        with:
          name: component-wheels-${{ matrix.label }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
      - name: Upload experimental wheel component
        if: ${{ matrix.experimental }}
        uses: actions/upload-artifact@v7
        with:
          name: component-EXPERIMENTAL-${{ matrix.label }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  experimental-extra-wheels:
    needs: preflight
    name: Experimental compatibility wheel / ${{ matrix.label }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-i686, os: ubuntu-24.04, archs: i686 }
          - { label: windows-x86, os: windows-2025, archs: x86 }
          - { label: macos-universal2, os: macos-15, archs: universal2 }
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install cibuildwheel
        shell: bash
        run: python -m pip install "cibuildwheel==${CIBUILDWHEEL_VERSION}"
      - name: Build experimental compatibility wheels
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
        shell: bash
        run: |
          if [[ "${{ matrix.label }}" == "linux-i686" ]]; then
            export CIBW_MANYLINUX_I686_IMAGE=manylinux2014
          fi
          python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: component-EXPERIMENTAL-${{ matrix.label }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  windows-arm64-preview:
    needs: preflight
    name: Experimental Windows ARM64
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_experimental }}
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install cibuildwheel
        shell: pwsh
        run: python -m pip install "cibuildwheel==$env:CIBUILDWHEEL_VERSION"
      - name: Build Windows ARM64 preview wheels
        env:
          CIBW_ARCHS: ARM64
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: component-EXPERIMENTAL-windows-arm64-preview
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  linux-emulated-architectures:
    needs: preflight
    name: Experimental Linux / ppc64le-s390x-armv7l-riscv64
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_experimental }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel==${CIBUILDWHEEL_VERSION}"
      - name: Build experimental Linux wheels
        env:
          CIBW_ARCHS_LINUX: "ppc64le s390x armv7l riscv64"
          CIBW_BUILD: "cp313-* cp314-*"
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: component-EXPERIMENTAL-linux-extra-architectures
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  experimental-portable-platforms:
    needs: preflight
    name: Experimental ${{ matrix.label }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Android-arm64-x86_64
            os: ubuntu-24.04
            platform: android
            archs: "arm64_v8a x86_64"
            build: "cp313-* cp314-*"
          - label: iOS-device-simulators
            os: macos-15
            platform: ios
            archs: "arm64_iphoneos arm64_iphonesimulator x86_64_iphonesimulator"
            build: "cp313-* cp314-*"
          - label: Pyodide-WASM
            os: ubuntu-24.04
            platform: pyodide
            archs: wasm32
            build: "cp313-* cp314-*"
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install cibuildwheel
        shell: bash
        run: python -m pip install "cibuildwheel==${CIBUILDWHEEL_VERSION}"
      - name: Build experimental platform wheels
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ARCHS: ${{ matrix.archs }}
          # Cross-platform tests are useful when the target runtime is available,
          # but a build artifact is still valuable if a GitHub-hosted runner cannot execute it.
          CIBW_TEST_COMMAND: ""
        run: python -m cibuildwheel --platform "${{ matrix.platform }}" --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: component-EXPERIMENTAL-${{ matrix.label }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  experimental-cpython315:
    needs: preflight
    name: Experimental CPython 3.15 / ${{ matrix.label }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x86_64, os: ubuntu-24.04, archs: x86_64 }
          - { label: linux-aarch64, os: ubuntu-24.04-arm, archs: aarch64 }
          - { label: windows-x64, os: windows-2025, archs: AMD64 }
          - { label: macos-intel, os: macos-15-intel, archs: x86_64 }
          - { label: macos-arm64, os: macos-15, archs: arm64 }
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install cibuildwheel
        shell: bash
        run: python -m pip install "cibuildwheel==${CIBUILDWHEEL_VERSION}"
      - name: Build CPython 3.15 prerelease wheels
        env:
          CIBW_BUILD: "cp315-*"
          CIBW_ENABLE: "cpython-prerelease"
          CIBW_ARCHS: ${{ matrix.archs }}
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: component-EXPERIMENTAL-CP315-${{ matrix.label }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Assemble one PyPI-ready bundle
    if: ${{ always() && needs.sdist.result == 'success' && needs.wheels.result == 'success' }}
    needs: [preflight, sdist, wheels, experimental-extra-wheels, windows-arm64-preview, linux-emulated-architectures, experimental-portable-platforms, experimental-cpython315]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Download every component artifact from this run
        uses: actions/download-artifact@v8
        with:
          path: collected
          pattern: component-*
          merge-multiple: false
      - name: Assemble and validate release directory
        env:
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          PACKAGE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          python tools/assemble_release_bundle.py \
            --collected collected \
            --output-parent . \
            --project-root . \
            --git-sha "$GIT_SHA" \
            --run-id "$RUN_ID"
          python tools/validate_release_bundle.py "YoungLion-${PACKAGE_VERSION}-release-bundle"
          python -m pip install --upgrade twine
          python -m twine check "YoungLion-${PACKAGE_VERSION}-release-bundle"/pypi/*
      - name: Upload the single release bundle
        uses: actions/upload-artifact@v7
        with:
          name: YoungLion-${{ needs.preflight.outputs.version }}-release-bundle
          path: YoungLion-${{ needs.preflight.outputs.version }}-release-bundle/
          if-no-files-found: error
          retention-days: 30
