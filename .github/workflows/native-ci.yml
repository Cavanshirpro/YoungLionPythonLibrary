name: Native C++ CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-platforms:
    name: ${{ matrix.name }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu-22.04-x64, os: ubuntu-22.04, python: "3.10" }
          - { name: Ubuntu-22.04-x64, os: ubuntu-22.04, python: "3.14" }
          - { name: Ubuntu-24.04-x64, os: ubuntu-24.04, python: "3.10" }
          - { name: Ubuntu-24.04-x64, os: ubuntu-24.04, python: "3.14" }
          - { name: Ubuntu-24.04-arm64, os: ubuntu-24.04-arm, python: "3.10" }
          - { name: Ubuntu-24.04-arm64, os: ubuntu-24.04-arm, python: "3.14" }
          - { name: Windows-2022-x64, os: windows-2022, python: "3.10" }
          - { name: Windows-2022-x64, os: windows-2022, python: "3.14" }
          - { name: Windows-2025-x64, os: windows-2025, python: "3.10" }
          - { name: Windows-2025-x64, os: windows-2025, python: "3.14" }
          - { name: macOS-15-Intel, os: macos-15-intel, python: "3.10" }
          - { name: macOS-15-Intel, os: macos-15-intel, python: "3.14" }
          - { name: macOS-15-ARM64, os: macos-15, python: "3.10" }
          - { name: macOS-15-ARM64, os: macos-15, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install test/build tooling
        run: python -m pip install --upgrade pip setuptools wheel pytest

      - name: Compile native extension
        run: python setup.py build_ext --inplace

      - name: Python syntax check
        run: python -m compileall -q src tools tests

      - name: Run source smoke test
        env:
          PYTHONPATH: src
        run: python tools/smoke_test.py

      - name: Run test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  strict-native:
    name: Strict compiler diagnostics / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip setuptools wheel pytest
      - name: Strict C++17 build
        env:
          YOUNGLION_STRICT: "1"
        run: python setup.py build_ext --inplace --force
      - name: Tests after strict build
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  linux-distributions:
    name: Source build / ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Debian-stable
            image: debian:stable-slim
            python_cmd: python3
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-dev python3-setuptools g++ ca-certificates
          - distro: Arch-Linux
            image: archlinux:base-devel
            python_cmd: python
            install: pacman -Syu --noconfirm python python-setuptools
          - distro: Fedora
            image: fedora:latest
            python_cmd: python3
            install: dnf install -y python3 python3-devel python3-setuptools gcc-c++
          - distro: Rocky-Linux-9
            image: rockylinux:9
            python_cmd: python3.11
            install: dnf install -y python3.11 python3.11-devel python3.11-setuptools gcc-c++
          - distro: openSUSE-Tumbleweed
            image: opensuse/tumbleweed
            python_cmd: python3
            install: zypper --non-interactive install python3 python3-devel python3-setuptools gcc-c++
          - distro: Alpine
            image: alpine:latest
            python_cmd: python3
            install: apk add --no-cache python3 python3-dev py3-setuptools g++ musl-dev
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build in clean distro container
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          INSTALL: ${{ matrix.install }}
          PYTHON_CMD: ${{ matrix.python_cmd }}
        run: |
          docker run --rm \
            -e INSTALL="$INSTALL" \
            -e PYTHON_CMD="$PYTHON_CMD" \
            -v "$PWD:/source:ro" \
            "$IMAGE" \
            /bin/sh -lc '
              set -eu
              sh -lc "$INSTALL"
              cp -a /source /work
              cd /work
              "$PYTHON_CMD" setup.py build_ext --inplace
              PYTHONPATH=src "$PYTHON_CMD" tools/smoke_test.py
            '

  experimental-windows-arm:
    name: Windows 11 ARM64 preview / Python 3.14
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip setuptools wheel pytest
      - run: python setup.py build_ext --inplace
      - name: Smoke test
        env:
          PYTHONPATH: src
        run: python tools/smoke_test.py
