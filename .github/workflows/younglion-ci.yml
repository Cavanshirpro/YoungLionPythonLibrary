name: Legacy workflow disabled

# This file intentionally remains at the historical path so replacing a source
# ZIP on top of an older checkout cannot accidentally resurrect the old
# v0.0.9.8 auto-release workflow. It never runs on push, pull_request, or tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    name: Archived workflow notice
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "The historical YoungLion Windows CI & Release workflow is disabled."
          echo "Use Native C++ CI and Build Distribution Artifacts instead."
